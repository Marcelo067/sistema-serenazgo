<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serenazgo - Inicio de sesión</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="tituloLogin">
      <div class="brand-login">
        <div class="brand-icon">✚</div>
        <div>
          <h1 id="tituloLogin">Sistema Inclusivo de Atención de Serenazgo</h1>
          <p>Municipalidad de Chorrillos · Prototipo académico</p>
        </div>
      </div>

      <div class="login-copy">
        <h2>Iniciar sesión</h2>
        <p>Ingresa tus credenciales para acceder al sistema.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field-group">
          <label for="correo">Correo</label>
          <input id="correo" type="email" autocomplete="username" placeholder="Correo electrónico" required>
        </div>

        <div class="field-group field-password">
          <label for="password">Contraseña</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="Contraseña" required>
        </div>

        <div id="loginError" class="feedback error hidden" role="alert"></div>

        <button class="btn btn-primary full login-submit" type="submit">Iniciar sesión</button>
      </form>

      <p class="academic-note">Acceso de demostración para evaluación académica.</p>
    </section>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
